# Optional Framework-specific Herdr overlay.
#
# Herdr's pane renderer uses palette.accent for a focused pane and
# palette.overlay0 for an inactive pane. These named ANSI roles resolve through
# Framework's terminal palette to the same colors as its Hyprland borders:
#   green    / ANSI 2 = #ac9cd6 (active)
#   darkgray / ANSI 8 = #4e3f6e (inactive)
#
# Install extras/framework-herdr-hook as documented in README.md to apply this
# overlay only while Framework is active and restore user values on theme exit.

[theme.custom]
accent = "green"
overlay0 = "darkgray"
