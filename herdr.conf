# Omarchy Framework — standalone Herdr theme profile
#
# Herdr 0.7.5 does not support user-defined names such as `name = "framework"`.
# This profile uses the terminal theme as its base and applies the complete
# Framework palette as custom token overrides.

onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#ff7547"      # Active tab and pane
surface0 = "#272037"    # Inactive tab background
surface_dim = "#272037" # Space and Agent selection background
overlay0 = "#8374b9"    # Inactive pane border, auto-numbered tab text, Agent directory
overlay1 = "#8374b9"    # Custom-named inactive tab and secondary sidebar text
text = "#ff7547"        # Active workspace title
subtext0 = "#c8b8e6"    # Inactive workspace title
green = "#4e3f6e"       # Agent item text
