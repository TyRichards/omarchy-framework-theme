mode = "dark"

# Framework's hot-orange UI accent.
accent = "#ff7547"
selection = "#ac9cd6"
selection_foreground = "#000000"
muted = "#4e3f6e"

# Neutral ramp. The subtle purple surface preserves the old Walker input and
# Herdr inactive-surface color without lifting the true-black base.
background = "#000000"
dark_background = "#000000"
darker_background = "#000000"
lighter_background = "#271f37"

foreground = "#ac9cd5"
dark_foreground = "#4e3f6e"
light_foreground = "#c8b8e6"
bright_foreground = "#dfcdfe"

# Semantic/ANSI colors. Cyan stays orange to preserve the original terminal
# accent placement; bright cyan returns to Framework lavender.
red = "#9684cc"
yellow = "#c8b8e6"
orange = "#ff7547"
green = "#ac9cd6"
cyan = "#ff7547"
# Herdr and stock Omarchy tmux use ANSI blue for the active pane border, so
# Framework maps that role to its orange accent while Hyprland stays lavender.
blue = "#ff7547"
magenta = "#9684cc"
brown = "#645c73"

bright_red = "#9684cc"
bright_yellow = "#c8b8e6"
bright_green = "#ac9cd6"
bright_cyan = "#ac9cd6"
bright_blue = "#8374b9"
bright_magenta = "#9684cc"

# Quattro's generated Hyprland and shell themes consume these independently
# from accent. Active windows are intentionally lavender, not orange.
hyprland_active_border = "#ac9cd6"
hyprland_inactive_border = "#4e3f6e"
