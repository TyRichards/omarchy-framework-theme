# Omarchy Framework Theme — tmux overrides
# Applied by the optional theme-set hook in omarchy-hooks/theme-set.d/framework-tmux.

# Framework accent from colors.toml
set -g pane-active-border-style "fg=#ff7547"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #T "
# set -g message-style "bg=default,fg=#ff7547"
# set -g message-command-style "bg=default,fg=#ff7547"
# set -g mode-style "bg=#ff7547,fg=black"
set -g status-left "#[fg=black,bg=#ac9cd5,bold] #S #[bg=default] "
# set -g status-right "#[fg=#ff7547]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
